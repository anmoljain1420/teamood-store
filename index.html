      /* Thermal print styling for POS receipts */
      @media print {
        body * {
          visibility: hidden;
        }
        #printable-receipt, #printable-receipt * {
          visibility: visible;
        }
        #printable-receipt {
          position: absolute;
          left: 0;
          top: 0;
          width: 80mm;
          margin: 0;
          padding: 8px;
          background: #ffffff !important;
          color: #000000 !important;
          font-family: 'Courier New', Courier, monospace;

      }
